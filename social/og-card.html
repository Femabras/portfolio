<!DOCTYPE html>
<!-- Generated by scripts/build.mjs from content/. Edit those, not this file. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<meta name="robots" content="noindex">
<title>Link preview · Fernando Brás</title>
<link rel="stylesheet" href="../public/main.css">
<style>
  /* 1200 by 630 is the size link previews are drawn for. */
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; }
  .og-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, var(--clear) 1px),
      linear-gradient(90deg, var(--grid) 1px, var(--clear) 1px);
    background-size: 48px 48px;
    -webkit-mask-image: linear-gradient(90deg, var(--clear) 35%, var(--opaque) 100%);
    mask-image: linear-gradient(90deg, var(--clear) 35%, var(--opaque) 100%);
  }
  .og-glow {
    position: absolute;
    top: -220px;
    right: -180px;
    width: 720px;
    height: 720px;
    border-radius: 50%;
    background: radial-gradient(closest-side, var(--glow-1), var(--glow-1-clear));
  }
  .og-inner {
    position: absolute;
    inset: 84px 88px;
    display: flex;
    flex-direction: column;
  }
  .og-mark { width: 64px; height: 64px; }
  .og-eyebrow {
    margin-top: 44px;
    color: var(--mint);
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .og-name { margin-top: 14px; font-size: 86px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
  .og-tagline { margin-top: 18px; color: var(--text); font-size: 34px; font-weight: 450; }
  .og-chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: auto; }
  .og-chips li {
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card-solid);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 20px;
  }
</style>
</head>
<body>
<div class="og-grid"></div>
<div class="og-glow"></div>
<main class="og-inner">
  <img class="og-mark" src="../assets/images/favicon.svg" alt="" width="64" height="64">
  <p class="og-eyebrow">Full-stack web engineer · Luanda, Angola · Remote</p>
  <h1 class="og-name">Fernando Brás</h1>
  <p class="og-tagline">Founder and engineer of Femabrás, from brief to production.</p>
  <ul class="og-chips"><li>React</li><li>Next.js</li><li>TypeScript</li><li>Go</li><li>PostgreSQL</li></ul>
</main>
</body>
</html>
